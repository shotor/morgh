[supervisord]
nodaemon=true
logfile=/var/log/supervisord/supervisord.log
pidfile=/var/run/supervisord/supervisord.pid
childlogdir=/var/log/supervisord/
logfile_maxbytes=50MB
logfile_backups=10
loglevel=error

[program:apache2]
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
command=apache2-foreground

# NOT /cron.sh: busybox crond resolves crontabs by USERNAME and uid 9000 has no passwd
# entry in the container — crond silently never ran a job (bit the old VM for 2 years).
# A plain loop runs as whatever uid supervisord has.
[program:cron]
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
command=/bin/sh -c "while true; do php -f /var/www/html/cron.php; sleep 300; done"
