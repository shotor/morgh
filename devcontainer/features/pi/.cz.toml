[tool.commitizen]
version = "0.1.2"
name = "cz_filter_path"
version_scheme = "semver2"
tag_format = "devcontainer/features/pi/$version"
ignored_tag_formats = ["*"]
filter_path = "devcontainer/features/pi"
update_changelog_on_bump = true
version_files = [".cz.toml:version", "devcontainer-feature.json:version"]
