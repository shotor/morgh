################################################################################
#################################### global ####################################
################################################################################

bind-key C-b send-prefix            # prefix
bind-key -n C-a send-prefix         # send prefix to inner tmux session
bind C-x setw synchronize-panes     # synchronize panes

# swap panes with prefix + alt + direction
bind -r M-h select-pane -L \; swap-pane -t !
bind -r M-j select-pane -D \; swap-pane -t !
bind -r M-k select-pane -U \; swap-pane -t !
bind -r M-l select-pane -R \; swap-pane -t !

bind p run-shell "$HOME/.shotor/bin/str tmux float --name commands -- str fzf commands"
bind R run-shell "$HOME/.shotor/bin/str tmux layout ultrawide restore"

set -g mouse on                     # enable mouse mode by default
set-option -g allow-rename off      # don't auto rename windows

# allow modern passthrough escape sequences
# for kitty compatbility
set -as terminal-features ",*:allow-passthrough"

################################################################################
##################################### tpm ######################################
##################### https://github.com/tmux-plugins/tpm ######################
################################################################################

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-pain-control'

################################################################################
#################################### theme #####################################
################################################################################

set -g status-position bottom
set -g status-justify left 
set -g status-left-length 10
set -g status-left ''
set -g status-right-length 100 
set -g status-right '#{net_speed} | #{battery_percentage} #{battery_remain} | #{uptime} | %a %Y-%m-%d %H:%M | #{tmux_mode_indicator}'

set -g status-style 'fg=#a599e9 bg=#2d2b55'
setw -g window-status-current-style 'fg=#fad000 bg=#4D21FC'
setw -g window-status-current-format ' #I #W #F '
setw -g window-status-style 'fg=#a599e9 bg=#2d2b55'
setw -g window-status-format ' #I #[fg=white]#W #[fg=yellow]#F '

################################################################################
############################# tmux-mode-indicator ##############################
############## https://github.com/MunifTanjim/tmux-mode-indicator ##############
################################################################################

set -g @plugin 'MunifTanjim/tmux-mode-indicator'

set -g @mode_indicator_prefix_prompt ' 🚀 '
set -g @mode_indicator_copy_prompt ' 🦍 '
set -g @mode_indicator_sync_prompt ' 🔥 '
set -g @mode_indicator_empty_prompt ' 🐪 '

set -g @mode_indicator_prefix_mode_style 'bg=#A599E9,fg=black'
set -g @mode_indicator_copy_mode_style 'bg=#ffee80,fg=black'
set -g @mode_indicator_sync_mode_style 'bg=#ec3a37,fg=black'
set -g @mode_indicator_empty_mode_style 'bg=#4d21fc,fg=black'

################################################################################
################################ tmux-net-speed ################################
################ https://github.com/tmux-plugins/tmux-net-speed ################
################################################################################

set -g @plugin 'tmux-plugins/tmux-net-speed'

set -g @download_speed_format "%8s"
set -g @upload_speed_format "%8s"
set -g @net_speed_format "󰮏 %8s 󰸇 %8s"

################################################################################
################################# tmux-uptime ##################################
################## https://github.com/robhurring/tmux-uptime ###################
################################################################################

set -g @plugin 'robhurring/tmux-uptime'

################################################################################
################################### treemux ####################################
###################### https://github.com/kiyoon/treemux #######################
################################################################################

set -g @plugin 'kiyoon/treemux'
set -g @treemux-tree-nvim-init-file '~/.tmux/plugins/treemux/configs/treemux_init.lua'

set -g @treemux-tree 'Tab'              # open file tree
set -g @treemux-tree-focus 'Bspace'     # open file tree and focus

################################################################################
################################ tmux-resurrect ################################
################ https://github.com/tmux-plugins/tmux-resurrect ################
################################################################################

set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-processes 'ssh'

set -g @resurrect-save 'C-s'        # save session
set -g @resurrect-restore 'C-r'     # restore sesion

################################################################################
################################ tmux-which-key ################################
############### https://github.com/alexwforsythe/tmux-which-key ################
################################################################################

set -g @plugin 'alexwforsythe/tmux-which-key'

set -g @wk_cfg_key_prefix_table "Space"

################################################################################
################################# tmux-fingers #################################
################## https://github.com/Morantron/tmux-fingers ###################
################################################################################
set -g @plugin 'Morantron/tmux-fingers'

set -g @fingers-key F
# tmux-open-nvim overrides matching file paths with :[line]:[col] at the end
set -g @fingers-pattern-0 "(([.\\w\\-~\\$@]+)(\\/?[\\w\\-@]+)+\\/?)\\.([\\w]+)(:\\d*:\\d*)?"
# tmux-open-nvim: launches helper script on Ctrl+[key] in fingers mode
set -g @fingers-ctrl-action "xargs -I {} tmux run-shell 'cd #{pane_current_path}; ~/.tmux/plugins/tmux-open-nvim/scripts/ton {} > ~/.tmux/plugins/tmux-open-nvim/ton.log'"s

################################################################################
################################ tmux-open-nvim ################################
################## https://github.com/trevarj/tmux-open-nvim ###################
################################################################################

set -g @plugin 'trevarj/tmux-open-nvim'

################################################################################
########################## tmux-nerd-font-window-name ##########################
########## https://github.com/joshmedeski/tmux-nerd-font-window-name ###########
################################################################################

set -g @plugin 'joshmedeski/tmux-nerd-font-window-name'

################################################################################
############################### tmux-neolazygit ################################
############### https://github.com/AngryMorrocoy/tmux-neolazygit ###############
################################################################################

set -g @plugin 'AngryMorrocoy/tmux-neolazygit'

set -g @open-lazygit 'G'

################################################################################
################################### tmux-fzf ###################################
##################### https://github.com/sainnhe/tmux-fzf ######################
################################################################################

set -g @plugin 'sainnhe/tmux-fzf'

TMUX_FZF_LAUNCH_KEY="C-f"
TMUX_FZF_OPTIONS="-p -w 64% -h 64% -m"

################################################################################
############################## tmux-mighty-scroll ##############################
################ https://github.com/noscript/tmux-mighty-scroll ################
################################################################################

set -g @plugin 'noscript/tmux-mighty-scroll'

################################################################################
############################# omerxx/tmux-sessionx #############################
################### https://github.com/omerxx/tmux-sessionx ####################
################################################################################

set -g @plugin 'omerxx/tmux-sessionx'

set -g @sessionx-bind 'O'

################################################################################
######################### spywhere/tmux-named-snapshot #########################
############### https://github.com/spywhere/tmux-named-snapshot ################
################################################################################

set -g @plugin 'spywhere/tmux-named-snapshot'

set -g @named-snapshot-save 'C-m:manual M:*'
set -g @named-snapshot-restore 'C-n:manual N:*'

################################################################################
########################### tmux-plugins/tmux-battery ##########################
################ https://github.com/tmux-plugins/tmux-battery ##################
################################################################################

set -g @plugin 'tmux-plugins/tmux-battery'

set -g @batt_remain_short 'true'
set -g @batt_icon_status_discharging '💧'
set -g @batt_icon_status_charged '☀️'
set -g @batt_icon_status_charging '⚡'

################################################################################
##################################### run ######################################
################################################################################

run '~/.tmux/plugins/tpm/tpm'

