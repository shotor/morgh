//
(() => {
  const Cc = Components.classes;
  const Ci = Components.interfaces;
  const observer = {
    observe() {
      const env = Cc["@mozilla.org/process/environment;1"].getService(Ci.nsIEnvironment);
      const file = Cc["@mozilla.org/file/local;1"].createInstance(Ci.nsIFile);
      const configHome = env.get("XDG_CONFIG_HOME");
      const home = Cc["@mozilla.org/file/directory_service;1"]
        .getService(Ci.nsIProperties).get("Home", Ci.nsIFile).path;
      file.initWithPath(configHome.startsWith("/") ? configHome : home + "/.config");
      file.append("firefox");
      file.append("user.js");
      if (!file.exists()) {
        file.initWithPath("/etc/firefox/morgh-user.js");
      }
      Cc["@mozilla.org/preferences-service;1"]
        .getService(Ci.nsIPrefService).readUserPrefsFromFile(file);
    },
  };
  Cc["@mozilla.org/observer-service;1"].getService(Ci.nsIObserverService)
    .addObserver(observer, "profile-after-change");
})();
