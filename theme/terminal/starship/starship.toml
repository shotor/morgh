add_newline = true
format = "$username$hostname$directory$git_branch$git_status$cmd_duration$line_break$character"

[username]
show_always = false
style_user = "yellow"
style_root = "bold red"
format = "[$user]($style)@"

[hostname]
ssh_only = false
style = "yellow"
format = "[$hostname]($style) "

[directory]
style = "bold blue"
truncation_length = 3
read_only = " ro"

[git_branch]
symbol = ""
style = "magenta"
format = "[$branch]($style) "

[git_status]
style = "yellow"

[cmd_duration]
style = "yellow"
format = "[$duration]($style) "

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold yellow)"
