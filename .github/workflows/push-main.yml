name: Push Main

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  collect:
    if: ${{ !startsWith(github.event.head_commit.message, 'bump:') }}
    runs-on: ubuntu-latest

    outputs:
      packages: ${{ steps.collect.outputs.packages }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Collect
        id: collect
        run: |
          packages="$(.scripts/collect --json)"
          echo "packages=$packages" >> "$GITHUB_OUTPUT"

  build:
    needs: collect
    if: ${{ needs.collect.outputs.packages != '[]' }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.collect.outputs.packages) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"
          cache: pip
          cache-dependency-path: .github/requirements.txt

      - name: Install Python dependencies
        run: .github/scripts/install-python-deps

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: .github/package-lock.json

      - name: Install Node dependencies
        run: .github/scripts/install-node-deps

      - name: Build
        id: build
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          parent="${PACKAGE%/*}"
          name="${PACKAGE##*/}"
          artifact="${PACKAGE//\//-}"

          result="$RUNNER_TEMP/build-result"
          mkdir -p "$result"

          "$parent/.scripts/build" "$name" > "$result/$artifact.tag"

          git add -A
          git diff --cached --binary > "$result/$artifact.patch"

          echo "artifact=$artifact" >> "$GITHUB_OUTPUT"

      - name: Upload result
        uses: actions/upload-artifact@v7
        with:
          name: build-${{ steps.build.outputs.artifact }}
          path: ${{ runner.temp }}/build-result

  commit:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.MAIN_DEPLOY_KEY }}

      - name: Download builds
        uses: actions/download-artifact@v8
        with:
          pattern: build-*
          path: ${{ runner.temp }}/build-results
          merge-multiple: true

      - name: Apply changes
        run: |
          for patch in "$RUNNER_TEMP"/build-results/*.patch; do
            git apply --index "$patch"
          done

      - name: Collect tags
        run: |
          cat "$RUNNER_TEMP"/build-results/*.tag \
            > "$RUNNER_TEMP/tags"

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit
        run: |
          mapfile -t tags < "$RUNNER_TEMP/tags"

          source .scripts/utils/commit_release
          commit_release "${tags[@]}"

      - name: Push
        run: |
          mapfile -t tags < "$RUNNER_TEMP/tags"

          git push origin HEAD:main

          for tag in "${tags[@]}"; do
            git push origin "refs/tags/$tag"
          done

          batch_tag="$(
            git tag \
              --list 'release/*' \
              --points-at HEAD |
              head -n 1
          )"

          git push origin "refs/tags/$batch_tag"
