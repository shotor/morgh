name: Release Dev Container Features

on:
  workflow_call:
    inputs:
      tag:
        description: Release batch tag
        required: true
        type: string

  workflow_dispatch:
    inputs:
      tag:
        description: Release batch tag
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  release:
    name: Release Features
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: .github/package-lock.json

      - name: Install Node dependencies
        run: .github/scripts/install-node-deps

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Release
        run: |
          devcontainer features publish \
            -r ghcr.io \
            -n shotor/devcontainer/features \
            devcontainer/features
