name: Release Docker

on:
  workflow_call:
    inputs:
      tag:
        description: Docker image tag to release
        required: true
        type: string

  workflow_dispatch:
    inputs:
      tag:
        description: Docker image tag to release
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  release:
    name: Release ${{ inputs.tag }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout tooling
        uses: actions/checkout@v7
        with:
          ref: main
          path: tooling
          fetch-depth: 0

      - name: Checkout release
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          path: release
          fetch-depth: 0

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Release
        working-directory: tooling
        env:
          TAG: ${{ inputs.tag }}
          RELEASE_DIR: ${{ github.workspace }}/release
        run: |
          package="${TAG%/*}"
          name="${package##*/}"
          parent="${package%/*}"

          "$parent/.scripts/release" \
            "$name" \
            "$RELEASE_DIR/$package"
