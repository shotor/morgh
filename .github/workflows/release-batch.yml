name: Release Batch

on:
  push:
    tags:
      - "release/**"

  workflow_dispatch:
    inputs:
      tag:
        description: Release batch tag
        required: false
        type: string

permissions:
  contents: read
  packages: write

jobs:
  collect:
    name: Collect
    runs-on: ubuntu-latest

    outputs:
      docker-image-tags: ${{ steps.collect.outputs.docker-image-tags }}
      devcontainer-image-tags: ${{ steps.collect.outputs.devcontainer-image-tags }}
      release-devcontainer-features: ${{ steps.collect.outputs.release-devcontainer-features }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Collect
        id: collect
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          source .scripts/utils/get_release_tags

          tags="$(get_release_tags "$TAG" --json)"

          docker_image_tags="$(
            jq -c '
              map(select(startswith("docker/images/")))
            ' <<< "$tags"
          )"

          devcontainer_image_tags="$(
            jq -c '
              map(select(startswith("devcontainer/images/")))
            ' <<< "$tags"
          )"

          release_devcontainer_features="$(
            jq -r '
              any(.[]; startswith("devcontainer/features/"))
            ' <<< "$tags"
          )"

          echo "docker-image-tags=$docker_image_tags" >> "$GITHUB_OUTPUT"
          echo "devcontainer-image-tags=$devcontainer_image_tags" >> "$GITHUB_OUTPUT"
          echo "release-devcontainer-features=$release_devcontainer_features" >> "$GITHUB_OUTPUT"

  docker-images:
    name: Release ${{ matrix.tag }}
    needs: collect
    if: ${{ needs.collect.outputs.docker-image-tags != '[]' }}

    strategy:
      fail-fast: false
      matrix:
        tag: ${{ fromJSON(needs.collect.outputs.docker-image-tags) }}

    uses: ./.github/workflows/release-docker.yml
    with:
      tag: ${{ matrix.tag }}

    secrets: inherit

  devcontainer-images:
    name: Release ${{ matrix.tag }}
    needs: collect
    if: ${{ needs.collect.outputs.devcontainer-image-tags != '[]' }}

    strategy:
      fail-fast: false
      matrix:
        tag: ${{ fromJSON(needs.collect.outputs.devcontainer-image-tags) }}

    uses: ./.github/workflows/release-devcontainer-images.yml
    with:
      tag: ${{ matrix.tag }}

    secrets: inherit

  devcontainer-features:
    name: Release Dev Container Features
    needs: collect
    if: ${{ needs.collect.outputs.release-devcontainer-features == 'true' }}

    uses: ./.github/workflows/release-devcontainer-features.yml
    with:
      tag: ${{ inputs.tag || github.ref_name }}

    secrets: inherit
