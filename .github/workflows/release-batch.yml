name: Release Batch

on:
  push:
    tags:
      - "release/**"

  workflow_dispatch:
    inputs:
      tag:
        description: Release batch tag
        required: false
        type: string

permissions:
  contents: read
  packages: write

jobs:
  collect:
    name: Collect
    runs-on: ubuntu-latest

    outputs:
      tags: ${{ steps.collect.outputs.tags }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Collect
        id: collect
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          source .scripts/utils/get_release_tags

          tags="$(get_release_tags "$TAG" --json)"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

  release:
    name: Release ${{ matrix.tag }}
    needs: collect

    strategy:
      fail-fast: false
      matrix:
        tag: ${{ fromJSON(needs.collect.outputs.tags) }}

    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ matrix.tag }}

    secrets: inherit
