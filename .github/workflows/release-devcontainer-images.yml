name: Release Dev Container Image

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Release
        env:
          TAG: ${{ inputs.tag }}
        run: |
          name="${TAG#devcontainer/images/}"
          name="${name%/*}"

          devcontainer/images/.scripts/release \
            "$name" \
            "$TAG"
